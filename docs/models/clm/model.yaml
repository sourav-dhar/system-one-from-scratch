# CLM-v0.1-8B: the companion site's flagship page (Tier A, draft).
# Every fact carries provenance and sources. Every benchmark-table number (accuracy, interval, Brier, p50,
# rank, reference line) is tied to its file and checked by scripts/site_data.py; numbers in prose are
# checked by review. Reviewed: two independent rounds on the Gate A0 mockup, then PR #56's review.

id: clm
name: CLM
version: "-v0.1-8B"
full_name: Contrastive Language Models, CLM-v0.1-8B
tier: A
family: biencoder
note: docs/research/systems/clm.md
eyebrow: [Tier A model page, "Family: bi-encoder, two towers", Open code + weights · no paper]
dek: >-
  A frozen Qwen3-8B reads the state, with its question, and each option separately. Two small trained heads
  map both into one space, and the option whose vector points most nearly the same way gets the most
  probability.
dek_sources: [{key: clm-repo, at: "src/clm/schema.py, heads.py, engine.py"}, {key: qwen3-8b, at: config.json}]
primer: [system-one-model, state, option, question-types, backbone, bi-encoder, head, last-token-embedding, cosine,
  softmax, logit-scale, calibration, lru-cache, vllm, brier, native-probabilities, answer-token-readout,
  system1-arena, leaves, harness, p50, bootstrap, leave-one-domain-out, modal]

spec:
  - label: Backbone
    value: Qwen3-8B, 36 layers, frozen
    provenance: code
    sources: [{key: qwen3-8b, at: config.json}, {key: clm-repo, at: serve_qwen3_8b.sh}]
  - label: Encoder serving
    value: vLLM pooling runner, last token, L2-normalised
    provenance: code
    sources: [{key: clm-repo, at: "serve_qwen3_8b.sh, src/clm/embedder.py"}]
  - label: Trained
    value: 2 MLP heads, 9,443,840 params each, + scale λ
    provenance: ours
    sources:
      - {key: clm-card, at: "released checkpoint CLM_v0.1-8B.pt (parameters counted by us)"}
      - {key: clm-repo, at: "README: '20M-parameter' head = the pair"}
  - label: Head output
    value: 4096-d → 512-d unit vector
    provenance: code
    sources: [{key: clm-repo, at: src/clm/heads.py}]
  - label: Served context cap
    value: 2,048 tokens (default)
    provenance: code
    sources: [{key: clm-repo, at: "src/clm/embedder.py (truncate_prompt_tokens), serve_qwen3_8b.sh"}]
  - label: Licence
    value: Apache-2.0, code and weights
    provenance: code
    sources: [{key: clm-card}, {key: clm-repo, at: LICENSE}]
  - label: Release date in code
    value: "2026-09-19"
    provenance: code
    sources: [{key: clm-repo, at: "src/clm/engine.py: RELEASE"}]

summary:
  what:
    - text: >-
        Qwen3-8B embeds the state-plus-question text and every option text separately. A state head and an
        action head project the 4096-d embeddings to 512-d unit vectors. Each option's logit is its cosine
        with the state vector times a learned scale, which the released checkpoint sets to the cap of 100,
        and a softmax turns the logits into one probability per option (at the default temperature).
      provenance: [code, inferred]
      sources:
        - {key: clm-repo, at: "src/clm/schema.py, heads.py, engine.py"}
        - {key: clm-card, at: "released checkpoint: λ = 4.6132, e^λ ≈ 100.8, clamped to 100"}
  why:
    - text: >-
        An option's vector never depends on the state, so it is computed once per option text and kept in a
        bounded, least-recently-used cache on the GPU; state vectors are cached by their text too.
      provenance: [code]
      sources: [{key: clm-repo, at: "src/clm/cache.py, engine.py"}]
    - text: >-
        Server-side median latency on an RTX 4090: a revisited state with cached options takes 0.6–0.7 ms
        (1.7–2.0 ms without the GPU cache), and a new state about 28 ms, mostly the backbone pass.
      provenance: [self-reported, inferred]
      sources: [{key: clm-repo, at: "README: vector-cache table (server-side p50, fixed action set); arrow direction and 'mostly the backbone pass' are our reading"}]
  weakness:
    - text: >-
        The options never see the state, and the scale ships at its cap with no calibration step. On the
        System1-Arena leaderboard CLM scores 41.4% with Brier 0.749, 17.8 points below an answer-token readout
        of its own backbone, which uses the same Qwen3-8B with no extra training.
      provenance: [code, inferred, independent]
      sources:
        - {key: clm-repo, at: "src/clm/schema.py, heads.py"}
        - {key: clm-card, at: released checkpoint}
        - {key: s1arena-repo, at: "leaderboard/results.json @28e16b1, snapshot 2026-10-14"}
    - text: >-
        The separation that makes caching possible is also the limitation: an option's vector cannot change
        with the state, so CLM ranks options by how close their text is to the state-plus-question text,
        rather than by applying the question to the state.
      provenance: [inferred]
      sources:
        - {key: "repo:docs/research/systems/clm.md", at: "Flaws (a) 11-12"}
        - {key: "repo:docs/research/README.md", at: "findings table, row 4"}
    - text: >-
        No experiment on System1-Arena has isolated why it scores lower. Candidates reported in the CLM
        repository: short option labels make the state irrelevant (issue #3), a shared question suffix makes
        different states embed alike (#15), and a logistic regression on the same frozen embeddings beats the
        trained heads (#13).
      provenance: [inferred, independent]
      sources:
        - {key: "repo:docs/research/README.md", at: "findings table, row 4"}
        - {key: clm-repo, at: "issues #3, #13, #15"}
    - text: >-
        Rescaling cannot change which option wins; on our run over the public subset, per-type temperatures
        move CLM's Brier from 0.741 to 0.607 at unchanged accuracy. The benchmark also kept only the last 2,048
        tokens of each CLM input, while the readout's inputs were not shortened (prompts over its limit were
        refused).
      provenance: [inferred, ours, independent]
      sources:
        - {key: "repo:results/references/s1arena/CALIBRATION.md"}
        - {key: s1arena-repo, at: "s1arena/models/clm.py, local_lm.py @28e16b1"}

benchmarks:
  - suite: s1arena
    title: "Benchmarks: System1-Arena"
    caption: >-
      System1-Arena, 13 non-agentic domains, 43,226 requests. Leaderboard snapshot of 2026-10-14 (harness
      28e16b1). Accuracy is the mean over 87 leaves; Brier is measured against the gold distribution, lower is
      better; p50 is the median single-request latency where stated, so network rows are not comparable with
      local ones. Five of the 30 rows are shown; ranks are out of 29 because Decision-2.0-Sol-2B has no score.
      Indented rows are our runs of the same model with our port of the harness, scored with the
      leaderboard's own aggregation.
    caption_sources:
      - {key: s1arena-repo, at: "leaderboard/results.json @28e16b1"}
      - {key: "repo:results/references/s1arena/leaderboard-2026-10-14.json"}
      - {key: "repo:results/references/s1arena/ANCHORS.md"}
    axis_max: 80
    reference: {row: Qwen3-8B, label: "Qwen3-8B answer-token readout: CLM's own backbone, read zero-shot"}
    notes:
      - text: >-
          Our runs use the pinned public dataset (ad05ed5, 41,183 of the 43,226 requests), which lacks 14
          restricted sources (2,043 requests), so their overall figures cover the public subset. Averaged over
          the eight complete domains, the gap to the published value is +0.05 points for Qwen3-8B and +0.12 for
          CLM, and each of those domains is within 0.9; the five incomplete domains differ by up to 4.8.
          Intervals are 95% paired bootstrap, resampling tasks within leaves and items within tasks.
        provenance: [ours]
        sources: [{key: "repo:results/references/s1arena/ANCHORS.md"}]
      - text: >-
          Calibrated rows fit one temperature per question type, leave-one-domain-out; temperature never
          changes the top option, so accuracy is unchanged.
        provenance: [ours]
        sources: [{key: "repo:results/references/s1arena/CALIBRATION.md"}]
