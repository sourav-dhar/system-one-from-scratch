claims:
  - text: "Head shape 4096→1536→1536→512; 9,443,840 parameters per head; λ = 4.613249 so e^λ = 100.81, clamped to 100"
    sources: [{key: clm-card, at: released checkpoint}, {key: clm-repo, at: heads.py}]
    verified_by: independent review agent, Gate A0 round 2 (loaded the checkpoint)
    date: 2026-11-23
  - text: "Qwen3-8B has 36 layers and hidden size 4096"
    sources: [{key: qwen3-8b, at: config.json}]
    verified_by: independent review agent, Gate A0 round 2
    date: 2026-11-23
  - text: "The client caps text at 2,048 tokens; vLLM 0.13+ keeps the first tokens; PRs #6 and #29 open; training keeps the tail up to 8,192"
    sources: [{key: clm-repo, at: "embedder.py, train/embed_utils.py, PRs #6 #29"}]
    verified_by: independent review agents, Gate A0 rounds 1 and 2
    date: 2026-11-23
  - text: "S1-Arena keeps CLM's last 2,048 tokens; no other model's input is shortened except Laya's (512)"
    sources: [{key: s1arena}, {key: "repo:docs/research/notes/raw/03-methods-deep-dive.md"}]
    verified_by: independent review agents, Gate A0 rounds 1 and 2 (via project notes)
    date: 2026-11-23
  - text: "State and option projections are cached in the GPU arena (default 2% of memory, LRU)"
    sources: [{key: clm-repo, at: "engine.py, cache.py, README"}]
    verified_by: independent review agent, Gate A0 round 2
    date: 2026-11-23
  - text: "Revisited state 0.6–0.7 ms with the arena, 1.7–2.0 ms without; new state 28.0–28.8 ms (RTX 4090, server-side p50)"
    sources: [{key: clm-repo, at: "README vector-cache table"}]
    verified_by: independent review agents, Gate A0 rounds 1 and 2
    date: 2026-11-23
  - text: "Every table number matches the 2026-10-14 snapshot, ANCHORS.md and CALIBRATION.md"
    sources: [{key: "repo:results/references/s1arena/leaderboard-2026-10-14.json"}, {key: "repo:results/references/s1arena/ANCHORS.md"}]
    verified_by: independent review agent, Gate A0 round 1; enforced by site_data.py check
    date: 2026-11-23
  - text: "No experiment isolates the cause of the 41.4 vs 59.3 gap; rescaling cannot change the argmax"
    sources: [{key: "repo:docs/research/README.md", at: "findings table, row 4"}]
    verified_by: independent review agent, Gate A0 round 1
    date: 2026-11-23
