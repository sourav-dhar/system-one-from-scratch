          brier: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/6/brier, match: {"/name": "Decision-2.0-Vega-27B"}}
          p50_ms: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/6/latency_ms, match: {"/name": "Decision-2.0-Vega-27B"}}
      - label: Jev 1.13
