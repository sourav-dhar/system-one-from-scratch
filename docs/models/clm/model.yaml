# CLM-v0.1-8B: the companion site's flagship page (Tier A).
# Every fact carries its provenance and sources; `ours` numbers are tied to results files and checked by
# scripts/site_data.py. Claims were verified by two independent review rounds on the Gate A0 mockup.

id: clm
name: CLM
version: "-v0.1-8B"
full_name: Contrastive Language Models, CLM-v0.1-8B
tier: A
family: biencoder
note: docs/research/systems/clm.md
eyebrow: [Tier A model page, "Family: bi-encoder, two towers", Open code + weights · no paper]
dek: >-
  A frozen Qwen3-8B reads the state, with its question, and each option separately. Two small trained heads
  map both into one space, and the option whose vector points most nearly the same way wins.

spec:
  - label: Backbone
    value: Qwen3-8B, 36 layers, frozen
    provenance: code
    sources: [{key: qwen3-8b, at: config.json}, {key: clm-repo, at: serve_qwen3_8b.sh}]
  - label: Trained
    value: 2 MLP heads, 9,443,840 params each, + scale λ
    provenance: code
    sources: [{key: clm-card, at: released checkpoint CLM_v0.1-8B.pt}, {key: clm-repo, at: train/finetune.py}]
  - label: Embedding
    value: last token, 4096-d → 512-d
    provenance: code
    sources: [{key: clm-repo, at: "src/clm/embedder.py, heads.py"}]
  - label: Served context cap
    value: 2,048 tokens
    provenance: code
    sources: [{key: clm-repo, at: src/clm/embedder.py (truncate_prompt_tokens)}]
  - label: Licence
    value: Apache-2.0
    provenance: code
    sources: [{key: clm-card}, {key: clm-repo, at: LICENSE}]
  - label: Released
    value: 2026-09-19 (engine.py)
    provenance: code
    sources: [{key: clm-repo, at: "src/clm/engine.py: RELEASE"}]

summary:
  what:
    - text: >-
        Qwen3-8B embeds the state-plus-question text and every option text separately. A state head and an
        action head project the 4096-d embeddings to 512-d unit vectors, and a softmax over cosines × 100 gives
        one probability per option.
      provenance: [code]
      sources: [{key: clm-repo, at: "src/clm/schema.py, heads.py, engine.py"}]
  why:
    - text: >-
        An option's vector never depends on the state, so it is computed once and cached on the GPU, and state
        vectors are cached by their text too.
      provenance: [code]
      sources: [{key: clm-repo, at: "src/clm/cache.py, engine.py"}]
    - text: >-
        A revisited state with cached options takes 0.6–0.7 ms on an RTX 4090 (1.7–2.0 ms without the GPU
        cache). A new state takes about 28 ms, mostly the backbone pass.
      provenance: [self-reported, inferred]
      sources: [{key: clm-repo, at: "README: vector-cache table (server-side p50, fixed action set)"}]
  weakness:
    - text: >-
        The options never see the state, and the scale ships at its cap with no calibration. On System1-Arena
        CLM scores 41.4% with Brier 0.749, 17.8 points below an answer-token readout of its own backbone.
      provenance: [code, independent]
      sources:
        - {key: clm-repo, at: "src/clm/schema.py, heads.py"}
        - {key: s1arena-repo, at: "leaderboard/results.json @28e16b1, snapshot 2026-10-14"}
    - text: >-
        No experiment has isolated why. Rescaling cannot change which option wins, and our temperature fit
        moves CLM's Brier from 0.741 to 0.607 at unchanged accuracy. The benchmark also cut CLM's inputs to
        their last 2,048 tokens but not the readout's.
      provenance: [inferred, ours, independent]
      sources:
        - {key: "repo:docs/research/README.md", at: "findings table, row 4"}
        - {key: "repo:results/references/s1arena/CALIBRATION.md"}
        - {key: s1arena, at: "CLM inputs: last 2,048 tokens"}

benchmarks:
  - suite: s1arena
    title: "Benchmarks: System1-Arena"
    caption: >-
      System1-Arena, 13 non-agentic domains, 43,226 requests. Leaderboard snapshot of 2026-10-14 (harness
      28e16b1). Accuracy is the mean over 87 leaves; Brier is measured against the gold distribution, lower is
      better; p50 is the median single-request latency where stated, so network rows are not comparable with
      local ones. Five of the 30 rows are shown; indented rows are our own runs of the same model, scored
      with the leaderboard's own aggregation.
    reference_line: 59.25
    reference_label: "Qwen3-8B answer-token readout, 59.25%: CLM's own backbone, read zero-shot"
    notes:
      - text: >-
          Our runs use the pinned public dataset (ad05ed5, 41,183 of the 43,226 requests), which lacks 14
          restricted sources (2,043 requests), so their overall figures cover the public subset. Over the eight
          complete domains, overall accuracy agrees with the published value within 0.12 points; single
          domains agree within 0.9. Intervals are 95% paired bootstrap, resampling tasks within leaves and
          items within tasks.
        provenance: [ours]
        sources: [{key: "repo:results/references/s1arena/ANCHORS.md"}]
      - text: >-
          Calibrated rows fit one temperature per question type, leave-one-domain-out; temperature never
          changes the top option, so accuracy is unchanged.
        provenance: [ours]
        sources: [{key: "repo:results/references/s1arena/CALIBRATION.md"}]
    rows:
      - label: Decision-2.0-Vega-27B
        rank: 7 / 29
        readout: native
        accuracy: 73.03
        brier: 0.3427
        p50_ms: 228.0
        measured_on: H100, local
        provenance: independent
        harness: s1arena@28e16b1
        sources: [{key: s1arena-repo, at: leaderboard/results.json}]
        checks:
          accuracy: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/6/accuracy, scale: 100, decimals: 2}
          brier: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/6/brier, decimals: 4}
          p50_ms: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/6/latency_ms, decimals: 1}
      - label: Jev 1.13
        rank: 8 / 29
        readout: native
        accuracy: 72.57
        brier: 0.3489
        p50_ms: 321.4
        measured_on: network API
        provenance: independent
        harness: s1arena@28e16b1
        sources: [{key: s1arena-repo, at: leaderboard/results.json}]
        checks:
          accuracy: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/7/accuracy, scale: 100, decimals: 2}
          brier: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/7/brier, decimals: 4}
          p50_ms: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/7/latency_ms, decimals: 1}
      - label: Qwen3-8B
        rank: 24 / 29
        readout: answer-token label probabilities
        accuracy: 59.25
        brier: 0.7153
        p50_ms: 30.4
        measured_on: H100, local
        provenance: independent
        harness: s1arena@28e16b1
        sources: [{key: s1arena-repo, at: leaderboard/results.json}]
        checks:
          accuracy: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/23/accuracy, scale: 100, decimals: 2}
          brier: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/23/brier, decimals: 4}
          p50_ms: {file: results/references/s1arena/leaderboard-2026-10-14.json, pointer: /models/23/latency_ms, decimals: 1}
      - label: our run, raw
        child: true
        readout: same readout, our port
        accuracy: 59.50
        accuracy_ci: [58.01, 61.11]
        brier: 0.7139
        measured_on: H100, Modal
        provenance: ours
        harness: s1arena@28e16b1
        sources: [{key: "repo:results/references/s1arena/ANCHORS.md"}]
        checks:
