corrections:
  - date: 2026-11-22
    commit: eb6f2f5
    where: our README, findings
    provenance: ours
    sources: [{key: "repo:README.md"}, {key: "repo:docs/research/systems/clm.md", at: "This project's reproduction"}]
    segments:
      - {kind: keep, text: "Re-scoring the authors' published heads with our evaluation code gives 51.73 / 69.16 / 68.63% on "}
      - {kind: del, text: "all"}
      - {kind: keep, text: " 191,161 "}
      - {kind: del, text: "held-out"}
      - {kind: keep, text: " hard-negative questions, "}
      - {kind: del, text: "matching the reference to four digits"}
      - {kind: ins, text: "within 0.4 points of the published 52.1 / 69.2 / 68.5, which were measured on a different sample of about 100k"}
      - {kind: keep, text: "."}

