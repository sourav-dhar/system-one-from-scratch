corrections:
  - date: 2026-11-22
    commit: eb6f2f5
    file: README.md
    where: our README, findings
    context: >-
      Our re-scoring of the authors' published pre-, mid- and post-training heads on their hard-negative
      test (top-1 accuracy per head).
    provenance: ours
    sources:
      - {key: "repo:README.md"}
      - {key: "repo:results/benchmark/heads.json", at: "hard / top1"}
    segments:
      - {kind: keep, text: "Re-scoring the authors' published heads with our evaluation code gives 51.73 / 69.16 / 68.63% on "}
      - {kind: del, text: "all"}
      - {kind: keep, text: " 191,161 "}
      - {kind: del, text: "held-out"}
      - {kind: keep, text: " hard-negative questions, "}
      - {kind: del, text: "matching the reference to four digits"}
      - {kind: ins, text: "within 0.4 points of the published 52.1 / 69.2 / 68.5 (measured on a different sample of about 100k)"}
      - {kind: keep, text: "."}

