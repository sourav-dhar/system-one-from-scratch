  - {element: "Licence: Apache-2.0 for code and weights", source: {key: clm-card}, status: covered, section: spec}
  - {element: "Access: weights, serving script, /v1/systemone-style interface, /v1/rank", source: {key: clm-repo, at: "README, serve_qwen3_8b.sh, schema.py"}, status: planned, section: try-it}
  - {element: "Unreleased multimodal CLM-35B", source: {key: clm-card}, status: planned, section: try-it}
  # --- architecture
  - {element: "Backbone, encoder serving (vLLM pooling runner), head output width and served context cap", source: {key: clm-repo, at: "serve_qwen3_8b.sh, embedder.py, heads.py"}, status: covered, section: spec}
  - {element: "Client-side L2 normalisation of the 4096-d embeddings; host LRU of 200k embeddings", source: {key: clm-repo, at: embedder.py}, status: planned, section: architecture}
  - {element: "Head architecture: Linear 4096→1536, GELU; Linear, LayerNorm, GELU; Linear →512; L2 norm", source: {key: clm-repo, at: heads.py}, status: planned, section: architecture}
  - {element: "heads.py function defaults vs fine-tuning defaults; parameter count vs the README's '20M' and '75 MB'", source: {key: clm-repo, at: "heads.py, train/finetune.py, README"}, status: planned, section: architecture}
