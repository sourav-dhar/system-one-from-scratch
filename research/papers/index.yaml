# Research library for the System One survey (docs/research/survey.md).
#
# arXiv entries list only the id plus our classification. Title, authors, date and licence are fetched
# from arXiv by scripts/fetch_papers.py; `expect` is a word that must appear in the fetched title,
# which guards against a mistyped id. Non-arXiv sources are link-only (`url`).
#
# family: biencoder | late-interaction | decoder-readout | encoder | encoder-decoder | looped |
#         frozen-reader | evaluation | serving | foundations | generative | data | community
#         | unclassified (new System One work we have not yet read and placed in the taxonomy)
# role:   implementation | benchmark | background | dataset | product

