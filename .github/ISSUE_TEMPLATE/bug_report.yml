name: Bug report
description: Something is broken or produces wrong numbers
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: Include the exact command and error output.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
  - type: input
    id: version
    attributes: {label: Commit / version, placeholder: "git rev-parse --short HEAD"}
