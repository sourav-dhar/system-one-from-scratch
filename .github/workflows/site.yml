name: Site

# Builds the companion site (site/) from the validated model data (docs/models/) on every PR and push.
# Deployment to GitHub Pages runs only on main, and only once the repository variable PAGES_ENABLED is
# "true" (Settings > Pages > Source: GitHub Actions must be switched on first).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check data, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # site_data.py needs only pyyaml and pydantic (versions as in uv.lock); skip the torch-heavy project env.
      - name: Site data is valid (schema, sources, checked numbers)
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 --with pydantic==2.14.4 python scripts/site_data.py check
      - name: Export site data
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 --with pydantic==2.14.4 python scripts/site_data.py export
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Type-check
        working-directory: site
        run: npx astro check
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Build
        working-directory: site
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
